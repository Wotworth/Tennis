# Tennis Vision (docs/VISION-REQUIREMENTS.md): MATLAB tests and the camera placement check.
# MathWorks' GitHub actions run MATLAB free for public repositories; no licence is stored here.
name: Vision tests

on:
  push:
    branches: [main]
    paths:
      - 'vision/**'
      - 'docs/preview/data/**'
      - '.github/workflows/vision.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run one job only (a manual run): all, test, fit-study, block-study, error-budget or shot-study'
        type: choice
        default: all
        options: [all, test, fit-study, block-study, error-budget, shot-study]

concurrency:
  group: vision-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'test'
    runs-on: ubuntu-latest
    # 180 since 20 Nov: every frame is now searched in the pipeline tests (run 53 took 81 min)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg (the pipeline's video tool, TV-ARCH-02)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Computer_Vision_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Signal_Processing_Toolbox
            Deep_Learning_Toolbox

      - name: Unit tests (TV-TST-02)
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: vision
          select-by-folder: vision/tests
          test-results-junit: test-results/vision.xml

      - name: Placement check (TV-CAL-04)
        if: success() || failure()
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('vision', 'vision/tools'); placementCheck('vision/config/placement.json', 'out/placement'); disp(version)

      - name: Preview plots (TV-OUT-05) from the synthetic preview session
        if: success() || failure()
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('vision', 'vision/tools'); previewPlots('docs/preview/data', 'out/preview-plots')

      - name: Print results into the log (artifact downloads are blocked in cloud sessions)
        if: always()
        run: |
          # the end-to-end test's stage results, to rerun the reconstruction in a session
          mkdir -p out/pipeline-stages
          for f in $(find /tmp "$RUNNER_TEMP" -path '*tv_pipeline_test/out/stages/*.mat' 2>/dev/null) $(find /tmp "$RUNNER_TEMP" -path '*tv_pipeline_test/synth/truth.mat' 2>/dev/null); do cp "$f" out/pipeline-stages/; done
          # the same for the adjacent-courts test (TV-ADJ-08), plus its reject log
          mkdir -p out/adjacent-stages
          for f in $(find /tmp "$RUNNER_TEMP" -path '*tv_adjacent_test/out/stages/*.mat' 2>/dev/null) $(find /tmp "$RUNNER_TEMP" -path '*tv_adjacent_test/synth/truth.mat' 2>/dev/null) $(find /tmp "$RUNNER_TEMP" -path '*tv_adjacent_test/out/rejects/*' 2>/dev/null) $(find /tmp "$RUNNER_TEMP" -path '*tv_adjacent_test/out/session.json' 2>/dev/null); do cp "$f" out/adjacent-stages/; done
          for f in $(find out/pipeline-stages out/adjacent-stages -type f -name '*.mat' -size -40M); do
            echo "=== BEGIN-B64 $f"; base64 -w 0 "$f"; echo; echo "=== END-B64"
          done
          for f in $(find out -type f \( -name '*.png' -o -name '*.md' -o -name '*.csv' -o -name '*.json' -o -name '*.gz' -o -name '*.html' \) 2>/dev/null); do
            echo "=== BEGIN-B64 $f"; base64 -w 0 "$f"; echo; echo "=== END-B64"
          done

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-results
          path: |
            out/
            test-results/

  # Chris, 16 Nov: the flight fit against truth it was not built from, over a
  # 90-minute session of about 400 shots (tools/fitStudy.m). Runs beside the tests.
  fit-study:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'fit-study'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg (the benchmark writes synthetic footage)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Computer_Vision_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Parallel_Computing_Toolbox

      - name: Benchmark smoke test (tools/benchmarkPC.m, quarter resolution)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('vision', 'vision/tools'); benchmarkPC(struct('quick', true, 'outDir', 'out/benchmark'));

      - name: Fit study (TV-TST-01, 400 shots)
        if: success() || failure()
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('vision', 'vision/tools'); fitStudy('out/fitstudy');

      - name: Print results into the log
        if: always()
        run: |
          for f in $(find out -type f \( -name 'fitstudy*' -o -name 'benchmark.md' \) 2>/dev/null); do
            echo "=== BEGIN-B64 $f"; base64 -w 0 "$f"; echo; echo "=== END-B64"
          done

  # Chris, 18 Nov: the flight fit with one camera blind for part of a flight (tools/blockStudy.m).
  block-study:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'block-study'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Computer_Vision_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Parallel_Computing_Toolbox

      - name: Block study (one camera blind, about 45 shots, 7 runs)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('vision', 'vision/tools'); blockStudy('out/blockstudy');

      - name: Print results into the log
        if: always()
        run: |
          for f in $(find out -type f -name 'blockstudy*' 2>/dev/null); do
            echo "=== BEGIN-B64 $f"; base64 -w 0 "$f"; echo; echo "=== END-B64"
          done

  # Chris, 20 Nov: hundreds of synthetic shots with Tuesday's set-up, one job per ball detector
  # (tools/shotStudy.m): detectors compared on speed, sideways curve measured, machine repeats.
  shot-study:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'shot-study'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # 20 Nov: the three detectors came out within 0.15 mph and 0.1 cm of each other (run 55);
        # now the learned one with gusts and in calm air, to see what the sideways curve's error is
        include:
          - detector: learned
            gust: '0.6'
          - detector: learned
            gust: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Computer_Vision_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Parallel_Computing_Toolbox

      - name: Shot study (${{ matrix.detector }}, gusts ${{ matrix.gust }} m/s, about 250 shots at 4K240 Linear)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('vision', 'vision/tools'); shotStudy('out/shotstudy', struct('detectors', {{'${{ matrix.detector }}'}}, 'targetShots', 250, 'minutes', 60, 'gustAmp', ${{ matrix.gust }}));

      - name: Print results into the log
        if: always()
        run: |
          for f in $(find out -type f \( -name 'shotstudy*' -o -name 'sizestudy*' -o -name 'fitstudy_*.md' \) 2>/dev/null); do
            echo "=== BEGIN-B64 $f"; base64 -w 0 "$f"; echo; echo "=== END-B64"
          done

  # Chris, 16 Nov: one error source at a time (tools/errorBudget.m), with its plots.
  error-budget:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'error-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Computer_Vision_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Parallel_Computing_Toolbox

      - name: Error budget (sync, calibration, detection, ball size, frame rate)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('vision', 'vision/tools'); errorBudget('out/errorbudget');

      - name: Print results into the log
        if: always()
        run: |
          for f in $(find out -type f \( -name 'errorbudget*' \) 2>/dev/null); do
            echo "=== BEGIN-B64 $f"; base64 -w 0 "$f"; echo; echo "=== END-B64"
          done
