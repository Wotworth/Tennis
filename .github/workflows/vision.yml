# Tennis Vision (docs/VISION-REQUIREMENTS.md): MATLAB tests and the camera placement check.
# MathWorks' GitHub actions run MATLAB free for public repositories; no licence is stored here.
name: Vision tests

on:
  push:
    branches: [main]
    paths:
      - 'vision/**'
      - '.github/workflows/vision.yml'
  workflow_dispatch:

concurrency:
  group: vision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Computer_Vision_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Signal_Processing_Toolbox

      - name: Unit tests (TV-TST-02)
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: vision
          select-by-folder: vision/tests
          test-results-junit: test-results/vision.xml

      - name: Placement check (TV-CAL-04)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('vision', 'vision/tools'); placementCheck('vision/config/placement.json', 'out/placement'); disp(version)

      - name: Print results into the log (artifact downloads are blocked in cloud sessions)
        if: always()
        run: |
          for f in $(find out -type f \( -name '*.png' -o -name '*.md' -o -name '*.csv' -o -name '*.json' \) 2>/dev/null); do
            echo "=== BEGIN-B64 $f"; base64 -w 0 "$f"; echo; echo "=== END-B64"
          done

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-results
          path: |
            out/
            test-results/
