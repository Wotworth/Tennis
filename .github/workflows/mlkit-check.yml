# PHO-10: proves the on-phone text reading works in the shrunk (R8) release build, on an emulator.
# The emulatorCheck build is the release build for x86_64, signed with the debug key, with a
# hidden self-test that reads a bundled sample package with ML Kit and logs the result.
name: Text reading check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Build the check APK (release shrinking, x86_64)
        run: ./gradlew :app:assembleEmulatorCheck --stacktrace

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator
        timeout-minutes: 20
        run: .github/scripts/start-emulator.sh

      - name: Read the sample package
        run: |
          apk=$(ls app/build/outputs/apk/emulatorCheck/*.apk | head -1)
          adb install -r "$apk"
          adb logcat -c
          adb shell am start -W -n io.github.wotworth.tennis/.MainActivity -a io.github.wotworth.tennis.SELFTEST
          line=""
          for i in $(seq 1 60); do
            line=$(adb logcat -d -s TennisSelfTest:I | grep -E "OK |FAIL " | tail -1 || true)
            [ -n "$line" ] && break
            sleep 2
          done
          echo "$line"
          { echo "### Text reading check"; echo '```'; echo "${line:-no result in 120 s}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$line" ]; then adb logcat -d | tail -80; exit 1; fi
          echo "$line" | grep -q "OK brand=Solinco model=Hyper-G gauge=16L" || { adb logcat -d | grep -iE "mlkit|tennis|AndroidRuntime" | tail -60; exit 1; }

      - name: Stop emulator
        if: always()
        run: adb emu kill || true
